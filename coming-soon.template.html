  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;

    html {

    body {

      border-radius: 2px;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.6;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    .cursor-dot {
      position: fixed;
      width: 8px;
      height: 8px;
      background: #c9a96e;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease, opacity 0.3s;
      mix-blend-mode: difference;
    }

    .cursor-ring {
      position: fixed;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(201, 169, 110, 0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.18s ease, width 0.25s ease, height 0.25s ease, opacity 0.3s;
    }

    @media (hover: none) {
      .cursor-dot, .cursor-ring {
        display: none !important;
      }
    }
  </style>

<body>
  <div id="root"></div>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <script>
    // Custom cursor
    const dot = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    if (dot && ring) {
      let mx = 0, my = 0, rx = 0, ry = 0;
      document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; });
      (function animate() { rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(animate); })();
      document.addEventListener('mousedown', () => { dot.style.transform = 'translate(-50%,-50%) scale(2)'; ring.style.width = '20px'; ring.style.height = '20px'; });
      document.addEventListener('mouseup', () => { dot.style.transform = 'translate(-50%,-50%) scale(1)'; ring.style.width = '32px'; ring.style.height = '32px'; });
    }
  </script>
